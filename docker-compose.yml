services:
  postgres:
    image: postgres:15
    container_name: servicehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-servicehub}
      POSTGRES_USER: ${POSTGRES_USER:-servicehub_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret_db_password}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - app-network
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-servicehub_user} -d $${POSTGRES_DB:-servicehub}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: servicehub-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-servicehub}
      DB_USER: ${POSTGRES_USER:-servicehub_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-secret_db_password}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    networks:
      - app-network

volumes:
  pg_data:
    name: pg_data

networks:
  app-network:
    name: app-network
    driver: bridge
