spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Flyway desativado nos testes de contexto com H2 (ddl-auto gera o schema)
spring.flyway.enabled=false

# Rate limiting desativado durante testes
app.rate-limit.enabled=false

# Configurações JWT para testes
app.jwt.secret=c2VydmljZWh1Yi1zZWNyZXQta2V5LWZvci1qd3Qtc2lnbmluZy1hbmQtdmFsaWRhdGlvbi10ZXN0LTEyMzQ1Ng==
app.jwt.expiration-ms=3600000
app.jwt.issuer=servicehub-test

app.cors.allowed-origins=http://localhost:3000

spring.graphql.graphiql.enabled=false
