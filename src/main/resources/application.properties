# Porta do servidor (padrão é 8080)
server.port=${SERVER_PORT:8080}

# Nome da aplicação
spring.application.name=servicehubapi

# Prefixo global para todas as rotas
server.servlet.context-path=/

# Nível de log
logging.level.com.servicehub=DEBUG

# Formato de data/hora na API
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# Configuração do DataSource (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:servicehub}
spring.datasource.username=${DB_USER:eduardo}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuração do Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Segurança, Rate Limiting e CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
app.rate-limit.enabled=true
app.rate-limit.login.capacity=5
app.rate-limit.login.period=1m
app.rate-limit.api.capacity=60
app.rate-limit.api.period=1m

# JWT & GraphQL
app.jwt.secret=${JWT_SECRET:c2VydmljZWh1Yi1zZWNyZXQta2V5LWZvci1qd3Qtc2lnbmluZy1hbmQtdmFsaWRhdGlvbi10ZXN0LTEyMzQ1Ng==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.issuer=servicehub-api

spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql
spring.graphql.schema.printer.enabled=true
